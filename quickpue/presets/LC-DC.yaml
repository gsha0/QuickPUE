# Topology preset LC-DC (requirements 8.4.1). Defaults are assumptions; override any value.
id: LC-DC
name: Liquid + air, dry coolers only
extends: _base_lc
water_system: WS-1
plant_type: CP-3
dcoptest: Type 10
description: Dry coolers only; supply temperature drifts (unmet) when ambient + approach
  exceeds the setpoint.
hall_name: Data hall
template:
  plants:
  - name: Plant
    type: CP-3
    loop: CHW
    dry_coolers:
    - name: DC
  loops:
  - name: CHW
    primary_pump:
      part_load:
        method: M2
        curve: K-DP(0.3)
        f_min: 0.3
        running: R-ALL
    supply_c: 30.0
    return_c: 40.0
    medium: pg
    glycol_pct: 25.0
