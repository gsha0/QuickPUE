# Topology preset LC-CH-DC (requirements 8.4.1). Defaults are assumptions; override any value.
id: LC-CH-DC
name: Liquid + air, chillers with dry cooler heat rejection
extends: _base_lc
water_system: WS-1
plant_type: CP-10
dcoptest: Type 12
description: Water-cooled chillers whose condenser water is cooled by dry coolers
  (T_db + 3 K reset).
hall_name: Data hall
template:
  plants:
  - name: Plant
    type: CP-10
    loop: CHW
    chillers:
    - name: WCC
      kind: water_cooled
    dry_coolers:
    - name: DC
      air_to_water_capacity_ratio: 1.5
    condenser_water:
      reset:
        type: drybulb_offset
        offset_k: 3.0
        min_c: 12.78
        max_c: 40.0
      pump:
        part_load:
          method: M3
          curve: K-CONST
  loops:
  - name: CHW
    primary_pump:
      part_load:
        method: M2
        curve: K-DP(0.3)
        f_min: 0.3
        running: R-ALL
