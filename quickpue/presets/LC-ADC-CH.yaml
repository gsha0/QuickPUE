# Topology preset LC-ADC-CH (requirements 8.4.1). Defaults are assumptions; override any value.
id: LC-ADC-CH
name: Adiabatic dry coolers + trim chillers
extends: _base_lc
water_system: WS-1
plant_type: CP-6
dcoptest: new
description: Adiabatic dry coolers pre-cool the return ahead of air-cooled trim chillers.
hall_name: Data hall
template:
  plants:
  - name: Plant
    type: CP-6
    loop: CHW
    chillers:
    - name: ACC
      kind: air_cooled
      recirculation_k: 2.7
    dry_coolers:
    - name: ADC
      adiabatic:
        activation_c: 25.0
        efficiency: 0.8
  loops:
  - name: CHW
    primary_pump:
      part_load:
        method: M2
        curve: K-DP(0.3)
        f_min: 0.3
        running: R-ALL
    medium: pg
    glycol_pct: 25.0
