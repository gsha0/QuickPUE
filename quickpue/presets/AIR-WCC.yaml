# Topology preset AIR-WCC (requirements 8.4.1). Defaults are assumptions; override any value.
id: AIR-WCC
name: Air cooled, water-cooled chillers, towers
extends: _base_air
water_system: WS-6
plant_type: CP-8
dcoptest: Type 3
description: Water-cooled chillers with cooling towers; condenser water reset T_wb
  + 3 K clamped 12.78 to 23.89 C (DCOPTEST).
hall_name: Data hall
template:
  plants:
  - name: Plant
    type: CP-8
    loop: CHW
    chillers:
    - name: WCC
      kind: water_cooled
    towers:
    - name: CT
    condenser_water:
      reset:
        type: wetbulb_offset
        offset_k: 3.0
        min_c: 12.78
        max_c: 23.89
      pump:
        part_load:
          method: M3
          curve: K-CONST
  loops:
  - name: CHW
    primary_pump:
      part_load:
        method: M2
        curve: K-DP(0.3)
        f_min: 0.3
        running: R-ALL
