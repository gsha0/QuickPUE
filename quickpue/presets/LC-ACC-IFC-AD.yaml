# Topology preset LC-ACC-IFC-AD (requirements 8.4.1). Defaults are assumptions; override any value.
id: LC-ACC-IFC-AD
name: Liquid + air, air-cooled chillers with integrated free cooling and adiabatic
  pads
extends: _base_lc
water_system: WS-1
plant_type: CP-2
dcoptest: new
description: As LC-ACC-IFC with adiabatic pads on the condenser air in mechanical
  modes.
hall_name: Data hall
template:
  plants:
  - name: Plant
    type: CP-2
    loop: CHW
    chillers:
    - name: ACC
      kind: air_cooled
      recirculation_k: 2.7
      integral_pump:
        part_load:
          method: M2
          curve: K-DP(0.3)
          f_min: 0.5
          running: R-ALL
      free_cooling:
        enable_dt_k: 1.0
      adiabatic:
        activation_c: 30.0
        efficiency: 0.8
  loops:
  - name: CHW
    medium: pg
    glycol_pct: 25.0
