# Topology preset LC-ACC-IFC (requirements 8.4.1). Defaults are assumptions; override any value.
id: LC-ACC-IFC
name: Liquid + air, air-cooled chillers with integrated free cooling
extends: _base_lc
water_system: WS-1
plant_type: CP-2
dcoptest: new
description: Air-cooled chillers with an integrated free cooling coil ahead of the
  evaporator (full / partial / mechanical).
hall_name: Data hall
template:
  plants:
  - name: Plant
    type: CP-2
    loop: CHW
    chillers:
    - name: ACC
      kind: air_cooled
      recirculation_k: 2.7
      integral_pump:
        part_load:
          method: M2
          curve: K-DP(0.3)
          f_min: 0.5
          running: R-ALL
      free_cooling:
        enable_dt_k: 1.0
  loops:
  - name: CHW
    medium: pg
    glycol_pct: 25.0
