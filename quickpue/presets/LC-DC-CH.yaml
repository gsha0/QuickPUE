# Topology preset LC-DC-CH (requirements 8.4.1). Defaults are assumptions; override any value.
id: LC-DC-CH
name: Liquid + air, dry coolers + chillers
extends: _base_lc
water_system: WS-1
plant_type: CP-5
dcoptest: Type 11
description: 'Dry coolers pre-cool the return in series ahead of air-cooled trim chillers
  (full / partial / mechanical). Note: DCOPTEST shares the dry cooler between WSE
  and condenser; here the trim chillers are air cooled.'
hall_name: Data hall
template:
  plants:
  - name: Plant
    type: CP-5
    loop: CHW
    chillers:
    - name: ACC
      kind: air_cooled
      recirculation_k: 2.7
    dry_coolers:
    - name: DC
  loops:
  - name: CHW
    primary_pump:
      part_load:
        method: M2
        curve: K-DP(0.3)
        f_min: 0.3
        running: R-ALL
    medium: pg
    glycol_pct: 25.0
